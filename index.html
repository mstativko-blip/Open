<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Конфигуратор Тубуса</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #f4f4f4;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(255, 255, 255, 0.9);
      padding: 12px 20px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      align-items: center;
      z-index: 10;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }
    .file-label {
      background: #007bff;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    input[type="file"] {
      display: none;
    }
  </style>
  <!-- Three.js и зависимостей -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="controls">
    <label for="colorPicker">Цвет:</label>
    <input type="color" id="colorPicker" value="#ffffff">
    <label class="file-label" for="imageLoader">Загрузить логотип</label>
    <input type="file" id="imageLoader" accept="image/*">
  </div>

  <script>
    let scene, camera, renderer, controls;
    let bodyMesh = null;
    let detailsMesh = null;
    let uploadedImage = null;
    let currentColorHex = '#ffffff';

    init();

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Сцена и Камера
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf4f4f4);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8);

      // 2. Рендерер и сочные настройки тона/цвета
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // 3. Управление камерой
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 4. Мягкое бестеневое студийное освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
      keyLight.position.set(5, 8, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
      fillLight.position.set(-5, 4, -5);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
      backLight.position.set(0, -6, -5);
      scene.add(backLight);

      // 5. Загрузка 3D-моделей
      const loader = new THREE.GLTFLoader();

      loader.load('Body.glb', (gltf) => {
        bodyMesh = gltf.scene;
        scene.add(bodyMesh);
        updateMaterials();
      });

      loader.load('Details.glb', (gltf) => {
        detailsMesh = gltf.scene;
        scene.add(detailsMesh);
        updateMaterials();
      });

      // 6. Обработчики событий
      document.getElementById('colorPicker').addEventListener('input', (e) => {
        currentColorHex = e.target.value;
        updateMaterials();
      });

      document.getElementById('imageLoader').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              uploadedImage = img;
              updateMaterials();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // Генерация динамической текстуры с логотипом
    function generateTexture(image, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (image) {
        const imgAspect = image.width / image.height;
        let drawWidth = canvas.width * 0.55; 
        let drawHeight = drawWidth / imgAspect;

        if (drawHeight > canvas.height * 0.55) {
          drawHeight = canvas.height * 0.55;
          drawWidth = drawHeight * imgAspect;
        }

        const x = (canvas.width - drawWidth) / 2;
        const y = (canvas.height - drawHeight) / 2;

        ctx.drawImage(image, x, y, drawWidth, drawHeight);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.flipY = false;
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;

      return texture;
    }

    function updateMaterials() {
      const dynamicTexture = generateTexture(uploadedImage, currentColorHex);

      if (bodyMesh) {
        bodyMesh.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              map: dynamicTexture,
              roughness: 0.35,
              metalness: 0.05,
              side: THREE.FrontSide
            });
            child.material.needsUpdate = true;
          }
        });
      }

      if (detailsMesh) {
        detailsMesh.traverse((child) => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({
              color: new THREE.Color(currentColorHex),
              roughness: 0.35,
              metalness: 0.05,
              side: THREE.DoubleSide
            });
            child.material.needsUpdate = true;
          }
        });
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
