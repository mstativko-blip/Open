<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Конфигуратор</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; padding: 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; }
    .container { max-width: 900px; margin: 0 auto; box-sizing: border-box; }
    #canvas-container { width: 100%; height: 420px; background: radial-gradient(circle at center, #fbfbfb 0%, #e9e9e9 100%); border-radius: 12px; position: relative; cursor: grab; }
    #canvas-container:active { cursor: grabbing; }
    .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; align-items: center; justify-content: space-between; }
    .group { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: #333; }
    input[type="color"] { border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    .btn { background: #111; color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: 500; font-size: 14px; cursor: pointer; border: none; }
    .btn-blue { background: #0071e3; }
    #logo-input { display: none; }
    .toast { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 30px; font-size: 13px; opacity: 0; transition: all 0.3s; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <div id="canvas-container"><div id="toast" class="toast">Скопировано в буфер!</div></div>
    <div class="controls">
      <div class="group"><label for="cp">Цвет:</label><input type="color" id="cp" value="#ffffff"></div>
      <div class="group"><label class="btn" for="logo-input">Загрузить логотип</label><input type="file" id="logo-input" accept="image/*"></div>
      <div class="group"><button class="btn btn-blue" id="copy-btn">Скопировать в буфер</button></div>
    </div>
  </div>
  <script>
    const GLB_URL = 'https://raw.githubusercontent.com/mstativko-blip/Open/refs/heads/main/Tube.glb';
    let scene, camera, renderer, controls, tubeMaterial;
    const container = document.getElementById('canvas-container');

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 3.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(5, 10, 7);
      scene.add(light);

      new THREE.GLTFLoader().load(GLB_URL, function(gltf) {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        model.position.sub(box.getCenter(new THREE.Vector3()));
        scene.add(model);
        model.traverse((child) => { if (child.isMesh) tubeMaterial = child.material; });
      });
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    document.getElementById('cp').addEventListener('input', (e) => { if (tubeMaterial) tubeMaterial.color.setStyle(e.target.value); });

    document.getElementById('logo-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.src = evt.target.result;
        img.onload = () => {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          texture.encoding = THREE.sRGBEncoding;
          if (tubeMaterial) { tubeMaterial.map = texture; tubeMaterial.needsUpdate = true; }
        };
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('copy-btn').addEventListener('click', () => {
      renderer.render(scene, camera);
      renderer.domElement.toBlob((blob) => {
        try {
          navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(() => showToast());
        } catch(e) { alert('Скопировать не удалось'); }
      });
    });

    function showToast() {
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    init();
  </script>
</body>
</html>
