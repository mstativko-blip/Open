<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Tube Configurator</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f4;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      z-index: 10;
    }
    .color-palette {
      display: flex;
      gap: 10px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .color-btn:hover {
      transform: scale(1.15);
    }
    .color-btn.active {
      outline: 2px solid #007bff;
      outline-offset: 2px;
    }
    .actions-row {
      display: flex;
      gap: 8px;
    }
    .btn {
      background: #007bff;
      color: #fff;
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #0056b3;
    }
    .btn-secondary {
      background: #e9ecef;
      color: #333;
    }
    .btn-secondary:hover {
      background: #dee2e6;
    }
    #imageLoader {
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-panel">
    <div class="color-palette">
      <div class="color-btn active" style="background-color: #ffffff;" data-color="#ffffff"></div>
      <div class="color-btn" style="background-color: #111111;" data-color="#111111"></div>
      <div class="color-btn" style="background-color: #e63946;" data-color="#e63946"></div>
      <div class="color-btn" style="background-color: #ffb703;" data-color="#ffb703"></div>
      <div class="color-btn" style="background-color: #2a9d8f;" data-color="#2a9d8f"></div>
      <div class="color-btn" style="background-color: #ff6b00;" data-color="#ff6b00"></div>
    </div>

    <div class="actions-row">
      <button class="btn" id="uploadBtn">Upload Logo</button>
      <input type="file" id="imageLoader" accept="image/*">
      <button class="btn btn-secondary" id="removeLogoBtn">Remove Logo</button>
      <button class="btn btn-secondary" id="screenshotBtn">Take Photo</button>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let bodyMesh = null;
    let detailsMesh = null;
    let uploadedImage = null;
    let currentColorHex = '#ffffff';

    const canvas = document.createElement('canvas');
    canvas.width = 2048;
    canvas.height = 2048;
    const ctx = canvas.getContext('2d');
    
    const bodyTexture = new THREE.CanvasTexture(canvas);
    bodyTexture.colorSpace = THREE.SRGBColorSpace;
    bodyTexture.flipY = false;

    // Двусторонний материал для Body
    const bodyMaterial = new THREE.MeshStandardMaterial({
      map: bodyTexture,
      roughness: 0.35,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    // Однотонный материал для Details
    const detailsMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(currentColorHex),
      roughness: 0.8,
      metalness: 0.05,
      side: THREE.DoubleSide
    });

    init();

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf4f4f4);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
      keyLight.position.set(5, 8, 5);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
      fillLight.position.set(-5, 4, -5);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
      backLight.position.set(0, -6, -5);
      scene.add(backLight);

      const loader = new THREE.GLTFLoader();

      loader.load('Body.glb', (gltf) => {
        bodyMesh = gltf.scene;
        bodyMesh.traverse((child) => {
          if (child.isMesh) {
            child.material = bodyMaterial;
          }
        });
        scene.add(bodyMesh);
        updateCanvasTexture();
      });

      loader.load('Details.glb', (gltf) => {
        detailsMesh = gltf.scene;
        detailsMesh.traverse((child) => {
          if (child.isMesh) {
            child.material = detailsMaterial;
          }
        });
        scene.add(detailsMesh);
        updateCanvasTexture();
      });

      // Палитра
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentColorHex = e.target.getAttribute('data-color');
          
          detailsMaterial.color.set(currentColorHex);
          updateCanvasTexture();
        });
      });

      // Загрузка фото
      const uploadBtn = document.getElementById('uploadBtn');
      const fileInput = document.getElementById('imageLoader');

      uploadBtn.addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              uploadedImage = img;
              updateCanvasTexture();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('removeLogoBtn').addEventListener('click', () => {
        uploadedImage = null;
        fileInput.value = '';
        updateCanvasTexture();
      });

      document.getElementById('screenshotBtn').addEventListener('click', async () => {
        renderer.render(scene, camera);
        renderer.domElement.toBlob(async (blob) => {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ 'image/png': blob })
            ]);
            const btn = document.getElementById('screenshotBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Copied!';
            setTimeout(() => { btn.innerText = originalText; }, 1500);
          } catch (err) {
            console.error('Failed to copy image to clipboard: ', err);
          }
        }, 'image/png');
      });

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function updateCanvasTexture() {
      ctx.fillStyle = currentColorHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (uploadedImage) {
        const imgAspect = uploadedImage.width / uploadedImage.height;
        
        let drawWidth = canvas.width * 0.40;
        let drawHeight = drawWidth / imgAspect;

        if (drawHeight > canvas.height * 0.40) {
          drawHeight = canvas.height * 0.40;
          drawWidth = drawHeight * imgAspect;
        }

        const x = (canvas.width - drawWidth) / 2;
        const y = (canvas.height - drawHeight) / 2;

        ctx.drawImage(uploadedImage, x, y, drawWidth, drawHeight);
      }

      bodyTexture.needsUpdate = true;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
